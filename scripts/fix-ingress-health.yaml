# ArgoCD ConfigMap patch to fix Ingress health check issues
#
# This configures ArgoCD to consider Ingress resources as healthy
# without waiting for LoadBalancer IP assignment
#
# OPTION 1: Patch existing ConfigMap (if you have other customizations)
# kubectl get configmap argocd-cm -n argocd -o yaml > argocd-cm-backup.yaml
# Then manually add the resource.customizations section below
#
# OPTION 2: Apply directly (WARNING: This will overwrite resource.customizations)
# kubectl apply -f scripts/fix-ingress-health.yaml
#
# OPTION 3: Use kubectl patch (safest)
# kubectl patch configmap argocd-cm -n argocd --type merge -p '{"data":{"resource.customizations.health.networking.k8s.io_Ingress":"hs = {}\nhs.status = \"Healthy\"\nreturn hs"}}'

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Ingress is healthy"
    return hs
