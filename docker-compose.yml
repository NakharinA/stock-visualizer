services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: "http://localhost:3000"
    # yfinance fetches live data — outbound internet access is required
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Points the Nuxt dev-proxy at the backend service inside Docker
      BACKEND_URL: "http://backend:8000"
      NUXT_PUBLIC_API_BASE: "http://localhost:8000"
    depends_on:
      - backend
    restart: unless-stopped
