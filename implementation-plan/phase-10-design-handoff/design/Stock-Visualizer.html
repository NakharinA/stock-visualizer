<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticker — Stock Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #101116;
  --panel: #161821;
  --panel-2: #1b1e28;
  --elev: #20232e;
  --line: #282b36;
  --line-soft: #1f222c;
  --text: #e9eaef;
  --text-2: #9aa0ac;
  --text-3: #6b7080;
  --accent: #ff7a18;
  --accent-2: #ffb05c;
  --accent-soft: rgba(255,122,24,0.13);
  --up: #2ebd85;
  --down: #f6465d;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --r: 12px;
  --r-sm: 8px;
  --sb: 78px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2c2f3a; border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #3a3e4b; }

.up { color: var(--up); }
.down { color: var(--down); }
.dim { color: var(--text-3); }

/* ---------- layout ---------- */
.app { display: flex; height: 100vh; }
.sidebar {
  width: var(--sb); flex: none; background: var(--panel);
  border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 0; gap: 8px;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 14px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(140deg, var(--accent), #e85d00);
  display: grid; place-items: center; color: #1a1205;
  box-shadow: 0 4px 16px rgba(255,122,24,0.28);
}
.brand-tx { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-2); text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 4px; width: 100%; align-items: center; }
.nav-i {
  width: 60px; height: 56px; border-radius: 12px; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  font-size: 10.5px; font-weight: 500; transition: background .15s, color .15s;
}
.nav-i span { letter-spacing: 0.01em; }
.nav-i:hover { color: var(--text); background: var(--panel-2); }
.nav-i.active { color: var(--accent); background: var(--accent-soft); }
.side-foot { margin-top: auto; font-size: 9px; color: var(--text-3); font-family: var(--mono); display: flex; align-items: center; gap: 5px; }
.dot-sim { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 60px; flex: none; border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 18px; padding: 0 24px; background: var(--bg);
}
.content { flex: 1; overflow: auto; min-height: 0; }

/* ---------- search ---------- */
.search { position: relative; width: 380px; max-width: 46vw; }
.search-box {
  display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text-3);
  transition: border-color .15s, background .15s;
}
.search-box.open, .search-box:focus-within { border-color: var(--accent); background: var(--panel-2); color: var(--text-2); }
.search-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; }
.search-input::placeholder { color: var(--text-3); }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--text-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.search-drop {
  position: absolute; top: 46px; left: 0; right: 0; z-index: 40;
  background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.5);
}
.sr-item { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; text-align: left; }
.sr-item.hi { background: var(--accent-soft); }
.sr-sym { font-family: var(--mono); font-weight: 600; font-size: 13px; width: 56px; flex: none; color: var(--text); }
.sr-name { flex: 1; color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-sec { font-size: 11px; color: var(--text-3); flex: none; }

.idx-chips { margin-left: auto; display: flex; gap: 8px; }
.idx-chip {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--line-soft);
}
.idx-chip:hover { border-color: var(--line); }
.ic-sym { font-weight: 600; font-size: 12px; }
.ic-px { font-size: 12px; color: var(--text-2); }
.ic-pct { font-size: 12px; font-family: var(--mono); }

/* ---------- generic page ---------- */
.page { padding: 28px 32px 40px; max-width: 1320px; margin: 0 auto; }
.h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--text-2); font-size: 13.5px; margin: 6px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 18px 20px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.panel-h h2 { font-size: 14px; font-weight: 600; margin: 0; color: var(--text); }
.link-btn { display: inline-flex; align-items: center; gap: 3px; color: var(--accent); font-size: 12.5px; font-weight: 500; }
.link-btn:hover { color: var(--accent-2); }
.empty { color: var(--text-3); font-size: 13px; padding: 24px 4px; text-align: center; }

/* ---------- delta ---------- */
.delta { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.pill { padding: 3px 8px; border-radius: 7px; }
.delta.up.pill { background: rgba(46,189,133,0.12); }
.delta.down.pill { background: rgba(246,70,93,0.12); }
.delta-tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
.delta-tri[data-up="true"] { border-bottom: 6px solid var(--up); }
.delta-tri[data-up="false"] { border-top: 6px solid var(--down); }

/* ---------- dashboard ---------- */
.dash-hero { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; }
.dash-hero .mono { color: var(--text); }
.mkt-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); padding: 7px 13px; border: 1px solid var(--line-soft); border-radius: 99px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 0 rgba(46,189,133,0.5); animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,189,133,0.45); } 70% { box-shadow: 0 0 0 7px rgba(46,189,133,0); } 100% { box-shadow: 0 0 0 0 rgba(46,189,133,0); } }

.idx-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.idx-card { text-align: left; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 16px 18px; transition: border-color .15s, transform .15s; }
.idx-card:hover { border-color: var(--line); transform: translateY(-2px); }
.idx-top { display: flex; align-items: center; justify-content: space-between; }
.idx-sym { font-weight: 600; font-size: 14px; letter-spacing: 0.01em; }
.idx-px { font-family: var(--mono); font-size: 22px; font-weight: 500; margin: 10px 0 8px; }
.idx-spark { margin-top: 4px; }

.dash-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
.wl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wl-card { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; text-align: left; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 13px 15px; transition: border-color .15s; }
.wl-card:hover { border-color: var(--accent); }
.wl-sym { font-weight: 600; font-size: 14px; }
.wl-name { font-size: 11.5px; color: var(--text-3); margin-top: 2px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wl-r { text-align: right; }
.wl-px { font-family: var(--mono); font-size: 14px; margin-bottom: 3px; }

.movers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mv-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.mv-h.up { color: var(--up); } .mv-h.down { color: var(--down); }
.mv-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; column-gap: 8px; width: 100%; padding: 7px 6px; border-radius: 7px; text-align: left; }
.mv-row:hover { background: var(--panel-2); }
.mv-sym { font-weight: 600; font-size: 12.5px; }
.mv-spark { display: none; }
.mv-px { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.mv-row .delta { font-size: 11.5px; min-width: 52px; justify-content: flex-end; }
@media (min-width: 1180px) { .mv-spark { display: flex; } .mv-row { grid-template-columns: 36px 46px 1fr auto; } }

/* ---------- overview ---------- */
.ov-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.add-form { display: flex; gap: 8px; }
.add-wrap { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text-3); }
.add-wrap:focus-within { border-color: var(--accent); }
.add-input { background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; width: 180px; font-family: var(--mono); text-transform: uppercase; }
.add-input::placeholder { color: var(--text-3); font-family: var(--sans); text-transform: none; }
.btn-accent { background: var(--accent); color: #1a1205; font-weight: 600; font-size: 13px; padding: 0 18px; border-radius: 10px; height: 40px; transition: background .15s; }
.btn-accent:hover { background: var(--accent-2); }
.form-err { color: var(--down); font-size: 12.5px; margin-bottom: 12px; }
.sugg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.sugg-l { font-size: 12px; color: var(--text-3); }
.chip { font-family: var(--mono); font-size: 12px; color: var(--text-2); padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; transition: all .15s; }
.chip:hover { color: var(--accent); border-color: var(--accent); }

.tbl-wrap { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; }
.tbl { width: 100%; border-collapse: collapse; }
.th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); padding: 13px 16px; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--line); }
.th.r { text-align: right; } .th.l { text-align: left; }
.th:hover { color: var(--text-2); }
.th.sorted { color: var(--accent); }
.caret { display: inline-block; width: 0; height: 0; margin-left: 5px; vertical-align: middle; }
.caret[data-dir="1"] { border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid currentColor; }
.caret[data-dir="-1"] { border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; }
.trow { border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background .12s; }
.trow:last-child { border-bottom: none; }
.trow:hover { background: var(--panel-2); }
.tbl td { padding: 13px 16px; font-size: 13.5px; }
.tbl td.r { text-align: right; }
.td-sym { font-family: var(--mono); font-weight: 600; font-size: 14px; }
.td-name { color: var(--text-2); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm-btn { width: 30px; height: 30px; border-radius: 8px; color: var(--text-3); display: grid; place-items: center; transition: all .15s; }
.rm-btn:hover { color: var(--down); background: rgba(246,70,93,0.12); }

/* ---------- chart page ---------- */
.chartpage { display: flex; flex-direction: column; height: 100%; }
.chart-head { display: flex; align-items: center; gap: 22px; padding: 16px 24px; border-bottom: 1px solid var(--line-soft); flex: none; }
.ch-id { min-width: 0; }
.ch-tick { display: flex; align-items: center; gap: 8px; }
.ch-sym { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.star-btn { color: var(--text-3); width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; }
.star-btn:hover { color: var(--accent); background: var(--accent-soft); }
.star-btn.on { color: var(--accent); }
.ch-name { font-size: 12.5px; color: var(--text-2); margin-top: 1px; display: flex; gap: 8px; }
.ch-sector { color: var(--text-3); }
.ch-price { display: flex; flex-direction: column; gap: 4px; }
.ch-last { font-family: var(--mono); font-size: 22px; font-weight: 600; }
.ch-periods { margin-left: auto; display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 4px; }
.seg { font-size: 12.5px; font-weight: 600; color: var(--text-3); padding: 6px 13px; border-radius: 7px; transition: all .13s; }
.seg:hover { color: var(--text); }
.seg.active { color: var(--accent); background: var(--accent-soft); }
.icon-btn { width: 32px; height: 32px; border-radius: 7px; color: var(--text-3); display: grid; place-items: center; margin-left: 4px; }
.icon-btn:hover { color: var(--text); background: var(--panel-2); }

.chart-body { flex: 1; display: flex; min-height: 0; }
.chart-col { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 8px 4px 8px 12px; }
.chart-main-wrap { flex: 1; position: relative; min-height: 0; }
.chart-main { position: absolute; inset: 0; }
.fvg-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.ohlc-legend { position: absolute; top: 10px; left: 12px; z-index: 4; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; background: rgba(16,17,22,0.6); backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 8px; pointer-events: none; }
.oh-sym { font-weight: 600; color: var(--text); }
.oh-per { color: var(--text-3); font-size: 11px; }
.oh-i { color: var(--text-2); }
.oh-i em { color: var(--text-3); font-style: normal; margin-right: 4px; }
.oh-chg { font-weight: 500; }
.ema-legend { position: absolute; top: 40px; left: 12px; z-index: 4; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 11px; pointer-events: none; }
.ema-chip { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); }
.ema-chip .dot { width: 8px; height: 2px; border-radius: 1px; }
.ema-chip b { color: var(--text); font-weight: 500; }

.osc-wrap { flex: none; display: flex; flex-direction: column; overflow: hidden; transition: height .22s ease, opacity .18s ease; border-top: 1px solid var(--line-soft); }
.osc-bar { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px 5px; flex: none; }
.osc-tabs { display: flex; gap: 3px; }
.osc-tab { font-size: 11.5px; font-weight: 600; color: var(--text-3); padding: 5px 11px; border-radius: 7px; }
.osc-tab:hover { color: var(--text); }
.osc-tab.active { color: var(--accent); background: var(--accent-soft); }
.osc-vals { display: flex; gap: 16px; font-family: var(--mono); font-size: 11.5px; padding-right: 8px; }
.osc-v { color: var(--text-3); display: inline-flex; gap: 6px; }
.osc-v b { font-weight: 600; }
.osc-chart { flex: 1; min-height: 0; }

/* ---------- indicator rail ---------- */
.ind-rail { width: 232px; flex: none; border-left: 1px solid var(--line-soft); background: var(--panel); padding: 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
.rail-grp { display: flex; flex-direction: column; gap: 3px; }
.rail-h { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); margin-bottom: 8px; padding-left: 4px; }
.tog { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 9px; text-align: left; transition: background .13s; }
.tog:hover { background: var(--panel-2); }
.tog-dot { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid; flex: none; transition: background .13s; }
.tog-lbl { flex: 1; font-size: 13px; color: var(--text-2); }
.tog.on .tog-lbl { color: var(--text); }
.tog-sw { width: 30px; height: 17px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.tog-sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--text-3); transition: transform .16s, background .16s; }
.tog-sw[data-on="true"] { background: var(--accent); }
.tog-sw[data-on="true"]::after { transform: translateX(13px); background: #1a1205; }
.rail-note { margin-top: auto; font-size: 10.5px; color: var(--text-3); font-family: var(--mono); text-align: center; padding-top: 8px; }

@media (max-width: 1100px) {
  .dash-grid { grid-template-columns: 1fr; }
  .idx-row { grid-template-columns: repeat(2, 1fr); }
  .hide-sm { display: none; }
  .ind-rail { width: 200px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<script src="lib/sv-data.js"></script>
<script type="text/babel" src="lib/ui.jsx"></script>
<script type="text/babel" src="lib/dashboard-overview.jsx"></script>
<script type="text/babel" src="lib/chart-page.jsx"></script>
<script type="text/babel" src="lib/app.jsx"></script>
</body>
